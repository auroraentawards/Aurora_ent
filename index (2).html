<style>

.burger{display:none;background:none;border:1px solid var(--ln);color:var(--gold);padding:6px 12px;font-size:20px;border-radius:6px}

.page{display:none;animation:in .8s ease}.page.on{display:block}

section{padding:80px 6vw;max-width:1200px;margin:auto}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 6vw;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#14204a 0%,var(--navy) 40%,var(--bg) 80%)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;text-align:center;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:40px 0}

.prize{text-align:center}.prize svg{width:70px;margin-bottom:6px}
.pg{padding:70px 6vw 20px;text-align:center;background:linear-gradient(var(--navy),var(--bg))}
form{max-width:640px;margin:auto;background:var(--card);border:1px solid var(--ln);padding:40px 34px}
label{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px}
input,select{width:100%;background:#070c1b;border:1px solid var(--ln);color:var(--tx);padding:14px;font:400 16px Montserrat;border-radius:2px}

.chk{display:flex;gap:10px;align-items:flex-start;margin-top:22px;font-size:13px;color:var(--mu);text-transform:none;letter-spacing:0}.chk input{width:auto;margin-top:5px}
.msg{margin-top:20px;padding:14px;border:1px solid var(--ln);font-size:14px;display:none}
.msg.err{display:block;color:#ffb4a8;border-color:#a0483a}.msg.ok{display:block;color:var(--gold2)}
.closed{text-align:center;padding:30px;border:1px solid #a0483a;color:#ffb4a8;max-width:640px;margin:0 auto;display:none}
.note{font-size:13px;color:var(--mu);margin-top:18px;text-align:center}
.rules{max-width:820px;margin:auto}.rules li{margin:0 0 18px 22px;color:var(--mu)}.rules li b{color:var(--gold2);font-weight:500}.rules h3{font-size:30px;color:var(--gold);margin:34px 0 14px}
.ci{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;max-width:900px;margin:auto}
footer{border-top:1px solid var(--ln);padding:40px 6vw;text-align:center;color:var(--mu);font-size:13px}
footer a{color:var(--gold);text-decoration:none;margin:0 10px}
@media(max-width:820px){.burger{display:block}.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:18px 6vw;border-bottom:1px solid var(--ln)}.links.open{display:flex}form{padding:28px 20px}section{padding:56px 6vw}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
